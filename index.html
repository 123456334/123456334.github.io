<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByteForge | 暗黑科技博客</title>
  <meta name="description" content="一个暗黑科技风格的个人技术博客">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">Byte<span>Forge</span></a>

      <button class="menu-toggle" id="menu-toggle" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="active">首页</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="搜索文章...">
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="container">
    <!-- 标签云 -->
    <section class="tag-cloud" id="tag-cloud">
      <!-- 动态生成 -->
    </section>

    <!-- 文章列表 -->
    <section class="posts-grid" id="posts-grid">
      <!-- 动态生成 -->
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>
        &copy; 2026 <span class="neon-text">ByteForge</span> |
        Powered by <span class="neon-text">HTML</span> + <span class="neon-text">CSS</span> + <span class="neon-text">JS</span>
      </p>
    </div>
  </footer>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="back-to-top" aria-label="返回顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- 脚本 -->
  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
