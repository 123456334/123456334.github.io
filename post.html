<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 | ning的博客</title>
  <meta name="description" content="ning的博客文章详情">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="logo">ning</a>

      <button class="menu-toggle" id="menu-toggle" aria-label="菜单">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于</a></li>
      </ul>
    </div>
  </nav>

  <!-- 主内容 -->
  <main class="container">
    <!-- 文章头部 -->
    <header class="post-header" id="post-header">
      <!-- 动态生成 -->
    </header>

    <!-- 目录 -->
    <aside class="toc" id="toc">
      <!-- 动态生成 -->
    </aside>

    <!-- 文章内容 -->
    <article class="post-content" id="post-content">
      <!-- 动态生成 -->
    </article>

    <!-- 文章导航 -->
    <nav class="post-nav" id="post-nav">
      <!-- 动态生成 -->
    </nav>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      <p>
        &copy; 2026 <span class="neon-text">ning</span> |
        Powered by <span class="neon-text">HTML</span> + <span class="neon-text">CSS</span> + <span class="neon-text">JS</span>
      </p>
    </div>
  </footer>

  <!-- 返回顶部按钮 -->
  <button class="back-to-top" id="back-to-top" aria-label="返回顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- 脚本 -->
  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
